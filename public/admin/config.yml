{
  "backend": {
    "name": "github",
    "repo": "yidigitalmm/Yi-digital-website",
    "branch": "main",
    "base_url": "https://yidigitalmm.com",
    "auth_endpoint": "api/cms/auth"
  },
  "publish_mode": "editorial_workflow",
  "media_folder": "public/uploads",
  "public_folder": "/uploads",
  "site_url": "https://yidigitalmm.com",
  "display_url": "https://yidigitalmm.com",
  "logo_url": "/brand/yi-digital-horizontal-light.svg",
  "local_backend": true,
  "collections": [
    {
      "name": "journal",
      "label": "Journal",
      "folder": "content/journal",
      "create": true,
      "format": "json",
      "extension": "json",
      "identifier_field": "slug",
      "slug": "{{slug}}",
      "summary": "{{en.title}}",
      "preview_path": "journal/{{slug}}",
      "editor": {
        "preview": false
      },
      "fields": [
        {
          "name": "slug",
          "label": "Article address",
          "widget": "string",
          "pattern": [
            "^[a-z0-9]+(?:-[a-z0-9]+)*$",
            "Use lowercase letters, numbers and hyphens."
          ],
          "hint": "Keep this unchanged after publishing to preserve links."
        },
        {
          "name": "order",
          "label": "Display order",
          "widget": "number",
          "value_type": "int",
          "min": 0,
          "default": 100,
          "hint": "Lower numbers appear first."
        },
        {
          "name": "image",
          "label": "Cover image",
          "widget": "image",
          "required": true,
          "allow_multiple": false
        },
        {
          "name": "en",
          "label": "English",
          "widget": "object",
          "collapsed": true,
          "fields": [
            {
              "name": "title",
              "label": "Title",
              "widget": "string"
            },
            {
              "name": "category",
              "label": "Category",
              "widget": "string"
            },
            {
              "name": "summary",
              "label": "Summary",
              "widget": "text"
            },
            {
              "name": "imageAlt",
              "label": "Image description",
              "widget": "string"
            },
            {
              "name": "readTime",
              "label": "Reading time",
              "widget": "string"
            },
            {
              "name": "intro",
              "label": "Introduction",
              "widget": "text"
            },
            {
              "name": "sections",
              "label": "Sections",
              "widget": "list",
              "min": 1,
              "summary": "{{fields.heading}}",
              "fields": [
                {
                  "name": "heading",
                  "label": "Heading",
                  "widget": "string"
                },
                {
                  "name": "paragraphs",
                  "label": "Paragraphs",
                  "widget": "list",
                  "field": {
                    "name": "item",
                    "label": "Text",
                    "widget": "text"
                  },
                  "required": true,
                  "min": 1
                }
              ]
            },
            {
              "name": "checklist",
              "label": "Checklist",
              "widget": "list",
              "field": {
                "name": "item",
                "label": "Text",
                "widget": "text"
              },
              "required": false
            },
            {
              "name": "closing",
              "label": "Closing paragraph",
              "widget": "text"
            }
